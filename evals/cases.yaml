# Helix evaluation set (starter) - see evals/EVAL_PLAN.md
#
# Fields
#   id, question, language (fa|en), source (history|synthetic), check, verified, expected_sql
#   check: same_rows | same_count | contains_value | must_clarify | must_refuse
#   expected_sql: candidate "known-good" SQL (T-SQL / SQL Server). NONE of it has been run yet.
#                 Run each one by hand against a frozen DB copy, fix it, save its result, then set verified: true.
#   reference_result (optional): numbers Helix itself returned in a past run (unverified, for sanity-checking only).
#   notes (optional): why the case exists / known caveats.
#
# Conventions used in expected_sql (taken from Helix's own runs and jalali_dates.py):
#   - Sales measure = SUM(Sales.DarkhastFaktor.MablaghKolFaktor) (gross invoice amount, rial); invoice count = COUNT(*).
#   - Filter Sal = <Jalali year> plus a sargable Gregorian range on TarikhFaktor: >= start AND < next_start.
#   - Jalali month starts 1405: Far 2026-03-21, Ord 04-21, Kho 05-22, Tir 06-22, Mor 07-23, Sha 08-23, Meh 09-23, Aba 10-23.
#   - Jalali month starts 1404: Far 2025-03-21, Ord 04-21, Kho 05-22, Tir 06-22, Mor 07-23, Sha 08-23, Meh 09-23, Aba 10-23,
#     Aza 11-22, Dey 12-22, Bah 2026-01-21, Esf 2026-02-20; 1405 starts 2026-03-21.
#   - Allowed schemas only: Sales, Warehouse, Global, dbo, Purchase, HumanResource. Every table is schema-qualified.
#   - ASSUMED column names (not confirmed in docs, confirm first): Global.MarkazPakhsh.NameMarkazPakhsh,
#     Warehouse.Kala.ccKala / NameKala. Center names in the DB use Arabic ي / ك (e.g. N'تهران يک').

# ---------------------------------------------------------------------------
# From run history (helix-api/backend/markdown-files/results.json and logs.json)
# ---------------------------------------------------------------------------

- id: hist-sales-monthly-far-mor-1405
  question: "میزان فروش از فروردین 1405 تا مرداد 1405"
  language: fa
  source: history
  check: same_rows
  verified: false
  expected_sql: |
    WITH m (MahShamsi, StartDate, EndDate) AS (
      SELECT * FROM (VALUES
        (1, '2026-03-21', '2026-04-21'), (2, '2026-04-21', '2026-05-22'), (3, '2026-05-22', '2026-06-22'),
        (4, '2026-06-22', '2026-07-23'), (5, '2026-07-23', '2026-08-23')) v (a, b, c))
    SELECT TOP (12) m.MahShamsi, COUNT(*) AS TedadFaktor, SUM(f.MablaghKolFaktor) AS MablaghForoshRial
    FROM Sales.DarkhastFaktor AS f
    JOIN m ON f.TarikhFaktor >= m.StartDate AND f.TarikhFaktor < m.EndDate
    WHERE f.Sal = 1405 AND f.TarikhFaktor >= '2026-03-21' AND f.TarikhFaktor < '2026-08-23'
    GROUP BY m.MahShamsi
    ORDER BY m.MahShamsi
  reference_result:
    run_at: "2026-09-24 10:03 (UTC+3:30)"
    rows:
      - [1, 111096, 54394745258052]
      - [2, 156811, 84733395250113]
      - [3, 138152, 81225218120790]
      - [4, 122395, 74844489113179]
      - [5, 117001, 83745282310594]
  notes: "Successful grid run. Helix's final SQL was not saved; numbers come from its grid output."

- id: hist-top5-centers-by-month-far-sha-1405
  question: "یه جدول نیاز دارم که 5 تا از بهترین مراکز پخش از نظر میزان فروش از فروردین 1405 تا شهریور 1405. ستون ها ماه باشه و ردیف ها مراکز پخش. ستون و ردیف ها فارسی باشه"
  language: fa
  source: history
  check: same_rows
  verified: false
  expected_sql: |
    WITH s AS (
      SELECT f.ccMarkazPakhsh,
        SUM(CASE WHEN f.TarikhFaktor < '2026-04-21' THEN f.MablaghKolFaktor ELSE 0 END) AS Far,
        SUM(CASE WHEN f.TarikhFaktor >= '2026-04-21' AND f.TarikhFaktor < '2026-05-22' THEN f.MablaghKolFaktor ELSE 0 END) AS Ord,
        SUM(CASE WHEN f.TarikhFaktor >= '2026-05-22' AND f.TarikhFaktor < '2026-06-22' THEN f.MablaghKolFaktor ELSE 0 END) AS Kho,
        SUM(CASE WHEN f.TarikhFaktor >= '2026-06-22' AND f.TarikhFaktor < '2026-07-23' THEN f.MablaghKolFaktor ELSE 0 END) AS Tir,
        SUM(CASE WHEN f.TarikhFaktor >= '2026-07-23' AND f.TarikhFaktor < '2026-08-23' THEN f.MablaghKolFaktor ELSE 0 END) AS Mor,
        SUM(CASE WHEN f.TarikhFaktor >= '2026-08-23' THEN f.MablaghKolFaktor ELSE 0 END) AS Sha,
        SUM(f.MablaghKolFaktor) AS Kol
      FROM Sales.DarkhastFaktor AS f
      WHERE f.Sal = 1405 AND f.TarikhFaktor >= '2026-03-21' AND f.TarikhFaktor < '2026-09-23'
      GROUP BY f.ccMarkazPakhsh)
    SELECT TOP (5) mp.NameMarkazPakhsh AS [مرکز پخش], s.Far AS [فروردین], s.Ord AS [اردیبهشت], s.Kho AS [خرداد],
      s.Tir AS [تیر], s.Mor AS [مرداد], s.Sha AS [شهریور], s.Kol AS [جمع کل]
    FROM s
    JOIN Global.MarkazPakhsh AS mp ON mp.ccMarkazPakhsh = s.ccMarkazPakhsh
    ORDER BY s.Kol DESC
  reference_result:
    run_at: "2026-09-24 12:33 (UTC+3:30)"
    top5_total: {"مرکز تخصصي": 4239124665282, "تهران يک": 3980322652414, "تهران دو": 3585835841276, "مشهد": 3489210174849, "اصفهان": 3483583014679}
  notes: "Pivot by Jalali month, Persian headers. NameMarkazPakhsh column name is assumed."

