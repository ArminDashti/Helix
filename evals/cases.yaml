        (1405, 4, '2026-06-22', '2026-07-23'), (1405, 5, '2026-07-23', '2026-08-23'), (1405, 6, '2026-08-23', '2026-09-23')) v (a, b, c, d))
    SELECT TOP (24) m.Sal, m.MahShamsi, SUM(f.MablaghKolFaktor) AS GrossSales
    FROM Sales.DarkhastFaktor AS f
    JOIN m ON f.Sal = m.Sal AND f.TarikhFaktor >= m.StartDate AND f.TarikhFaktor < m.EndDate
