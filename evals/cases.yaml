  language: en
  source: synthetic
  check: same_rows
  verified: false
  expected_sql: |
    SELECT TOP (10) k.NameKala, SUM(s.MablaghForoshKhalesKala) AS NetSales
    FROM Sales.DarkhastFaktorSatr AS s
