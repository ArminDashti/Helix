- id: hist-sales-monthly-4-centers-far-mor-1405
  question: "میزان فروش از فروردین 1405 تا مرداد 1405 به تفکیک ماه رو می خوام و مراکز ساری، شیراز، اهواز و مشهد به زبان فارسی"
  language: fa
  source: history
  check: same_rows
  verified: false
  expected_sql: |
    SELECT TOP (50) mp.NameMarkazPakhsh AS [مرکز پخش],
      CASE WHEN f.TarikhFaktor < '2026-04-21' THEN 1
           WHEN f.TarikhFaktor < '2026-05-22' THEN 2
           WHEN f.TarikhFaktor < '2026-06-22' THEN 3
           WHEN f.TarikhFaktor < '2026-07-23' THEN 4
           ELSE 5 END AS [ماه],
      SUM(f.MablaghKolFaktor) AS [مبلغ فروش]
    FROM Sales.DarkhastFaktor AS f
    JOIN Global.MarkazPakhsh AS mp ON mp.ccMarkazPakhsh = f.ccMarkazPakhsh
    WHERE f.Sal = 1405 AND f.TarikhFaktor >= '2026-03-21' AND f.TarikhFaktor < '2026-08-23'
      AND mp.NameMarkazPakhsh IN (N'ساري', N'ساری', N'شيراز', N'شیراز', N'اهواز', N'مشهد')
    GROUP BY mp.NameMarkazPakhsh,
      CASE WHEN f.TarikhFaktor < '2026-04-21' THEN 1
           WHEN f.TarikhFaktor < '2026-05-22' THEN 2
           WHEN f.TarikhFaktor < '2026-06-22' THEN 3
           WHEN f.TarikhFaktor < '2026-07-23' THEN 4
           ELSE 5 END
    ORDER BY [مرکز پخش], [ماه]
  notes: >-
    Past runs failed for infrastructure reasons (Cursor CLI missing, client disconnect), never got an answer.
    Tests matching Persian names typed with ی against DB values stored with Arabic ي.

