# Standalone stack for npx @armindashti/helix (no host-specific external networks).
name: helix-npx

services:
  helix-api:
    build:
      context: ../helix-api
      dockerfile: dockerfile
    image: helix-api:npx
    container_name: helix-npx-api
    restart: unless-stopped
    environment:
      HELIX_ALLOWED_HOSTS: "*"
      HELIX_DEBUG: "false"
      HELIX_DJANGO_ENGINE: sqlite
      HELIX_DJANGO_SQLITE_PATH: /app/backend/data/helix-django.sqlite3
      HELIX_CORS_ORIGINS: "http://127.0.0.1:${HELIX_WEBUI_PORT:-8181},http://localhost:${HELIX_WEBUI_PORT:-8181}"
      GUNICORN_TIMEOUT: "660"
      OPENROUTER_TOKEN: ${OPENROUTER_TOKEN:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      PORT: "8000"
    volumes:
      - helix-sqlite-data:/app/backend/data
      - ${HELIX_CONFIG_FILE}:/app/helix.config.yaml
    ports:
      - "8173:8000"

  helix-webui:
    build:
      context: ../helix-webui
      dockerfile: dockerfile.npx
      args:
        VITE_BASE_PATH: /
        VITE_API_BASE_URL: http://127.0.0.1:8173
    image: helix-webui:npx
    container_name: helix-npx-webui
    restart: unless-stopped
    ports:
      - "${HELIX_WEBUI_PORT:-8181}:80"

volumes:
  helix-sqlite-data:
    name: helix-npx-sqlite-data
